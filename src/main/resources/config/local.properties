#
#
# ------------------------------------
# DETALLE
# ------------------------------------
#
#  Esta configuracion es para cuando todo corre en Dockers localmente
#  Para ejecutar esto en modo local fuera de docker usar local.properties
#
# ------------------------------------------------
# HTTPS
# ------------------------------------------------
http.port=8082
https.port=8083
#
#
# ------------------------------------------------
# APACHE MQ
# ------------------------------------------------
#
# Es importante si el apache corre en Docker
# agregar la lina 
#     127.0.0.1       ce-base-apachemq-backend
# en el archivo host
#
apachemq.url=tcp://ce-base-apachemq-backend:8162
apachemq.initialRedeliveryDelay=30000
apachemq.redeliveryDelay=30000
apachemq.maxRedelivery=2
#
apachemq.status.queue.name=health.request
# 
# ------------------------------------------------
# Entidad
# ------------------------------------------------
#
entidad.id=ATINA
entidad.description=ATINA Company
#  
 
# ------------------------------------------------
# Token Server
# ------------------------------------------------
#
atina.host=dockia-api.dock-ia.com
atina.port=443
#
atina.token.url=/api/v1/oauth2/token
atina.token.user=acme-admin
atina.token.pass=admin123
#
# 